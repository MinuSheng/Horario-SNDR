
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario de Snayder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --chile-color: #ec4899;
            
            --home: #10b981;
            --bus: #f59e0b;
            --work: #ef4444;
            --free: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Shift Selector */
        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            appearance: none;
        }

        /* Timezone Switch */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .zone-label {
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s, opacity 0.3s;
        }

        .zone-nica { color: var(--accent); }
        .zone-chile { color: var(--chile-color); }
        
        .inactive-zone { opacity: 0.4; }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--accent);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input:checked + .slider {
            background-color: var(--chile-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Live Status */
        .live-status {
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.1);
        }

        .status-text {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            min-height: 4.5rem;
        }

        .main-clock {
            font-size: 3rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
            transition: color 0.3s;
        }

        .clock-label-big {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        /* Timetable */
        .timetable {
            margin-top: 1.5rem;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.2rem;
            position: relative;
            transition: opacity 0.3s;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .time-col {
            min-width: 130px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }

        .desc-col {
            padding-left: 1rem;
            border-left: 3px solid;
            padding-bottom: 0.5rem;
        }

        .desc-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        
        .desc-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Branding */
        .footer {
            margin-top: 2rem;
            text-align: center;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #475569 20%, #e2e8f0 50%, #475569 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: sweepRightToLeft 3s linear infinite;
        }

        @keyframes sweepRightToLeft {
            0% { background-position: 200% center; }
            100% { background-position: 0% center; }
        }

        .shift-picker { position:relative; }
        .shift-trigger { width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:1rem 1.15rem;background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.25);border-radius:14px;color:#f8fafc;font:inherit;font-size:1rem;cursor:pointer;transition:border-color .25s,box-shadow .25s; }
        .shift-trigger:focus-visible,.shift-picker.open .shift-trigger {outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.13);}
        .shift-chevron {font-size:1.5rem;color:var(--accent);line-height:1;transition:transform .3s cubic-bezier(.2,.8,.2,1);}
        .shift-picker.open .shift-chevron {transform:rotate(180deg);}
        .shift-menu {position:absolute;top:calc(100% + 9px);left:0;right:0;z-index:20;padding:7px;background:#101b2d;border:1px solid rgba(148,163,184,.35);border-radius:17px;box-shadow:0 24px 65px rgba(0,0,0,.75);opacity:0;visibility:hidden;transform:translateY(-9px) scale(.98);transform-origin:top;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;}
        .shift-picker.open .shift-menu {opacity:1;visibility:visible;transform:translateY(0) scale(1);}
        .shift-option {width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 13px;border:0;border-radius:11px;background:transparent;color:#f8fafc;font:inherit;cursor:pointer;transition:background .2s;}
        .shift-option + .shift-option {margin-top:3px;}
        .shift-option strong,.shift-option small {display:block;}
        .shift-option strong {font-size:.95rem;font-weight:600;}
        .shift-option small {font-size:.73rem;color:#94a3b8;margin-top:2px;}
        .shift-option:hover,.shift-option:focus-visible,.shift-option.selected {background:rgba(56,189,248,.11);outline:none;}
        .option-check {opacity:0;color:#38bdf8;font-size:1.2rem;}
        .shift-option.selected .option-check {opacity:1;}
        @media (prefers-reduced-motion:reduce) {.shift-menu,.shift-chevron,.shift-option {transition:none;}}

        .shift-picker {position:relative;z-index:30;isolation:isolate}
        .shift-menu {background-color:#101b2d!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;z-index:100}
        .dual-clocks {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:23px;text-align:left}
        .mini-clock {padding:14px 12px;border-radius:14px;background:#101a2c;border:1px solid rgba(148,163,184,.2);min-width:0}
        .mini-clock span {display:block;font-size:.76rem;color:#cbd5e1;white-space:nowrap}
        .mini-clock strong {display:block;font-size:clamp(1.15rem,5vw,1.6rem);font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
        .nica-mini strong {color:var(--accent)} .chile-mini strong {color:var(--chile-color)}
        .time-difference {color:var(--text-muted);font-size:.76rem;margin-top:12px}
        .connect-loader {position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#0b1222,#18243a);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .55s ease,visibility .55s ease}
        .connect-loader.hidden {opacity:0;visibility:hidden;pointer-events:none}
        .loader-inner {width:min(100%,430px);text-align:center}
        .loader-heading {font-size:clamp(1.25rem,5vw,1.65rem);font-weight:700;color:#f8fafc}
        .heart {color:#ec4899;animation:heartbeat 1.1s ease-in-out infinite;display:inline-block}
        .route-art {display:block;width:100%;max-width:340px;margin:24px auto 8px;overflow:visible}
        .route-guide {fill:none;stroke:#43536c;stroke-width:2;stroke-dasharray:3 8;stroke-linecap:round}
        .route-line {fill:none;stroke:url(#route-gradient);stroke-width:3;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:draw-route 1.75s ease-out forwards}
        .flying-plane {offset-path:path('M42 120 Q165 -25 298 70');offset-distance:0%;animation:fly-route 1.75s ease-in-out forwards;transform:rotate(-10deg)}
        .loader-message {font-size:.86rem;color:#a5b4ca}
        .loader-progress {height:3px;background:#28364d;border-radius:4px;overflow:hidden;margin:20px auto 0;width:68%}
        .loader-progress span {display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#ec4899);animation:load-bar 1.85s ease forwards}
        @keyframes draw-route {to{stroke-dashoffset:0}}
        @keyframes fly-route {to{offset-distance:100%}}
        @keyframes load-bar {from{width:0}to{width:100%}}
        @keyframes heartbeat {50%{transform:scale(1.22)}}
        @media (prefers-reduced-motion:reduce) {.heart,.route-line,.flying-plane,.loader-progress span{animation:none}.route-line{stroke-dashoffset:0}.flying-plane{offset-distance:100%}}
    </style>
</head>
<body>
    <div id="connect-loader" class="connect-loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <div class="loader-heading">Conectando nuestros horarios <span class="heart">♥</span></div>
        <svg class="route-art" viewBox="0 0 340 170" aria-hidden="true">
          <defs><linearGradient id="route-gradient"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
          <path class="route-guide" d="M42 120 Q165 -25 298 70"/>
          <path class="route-line" d="M42 120 Q165 -25 298 70"/>
          <circle cx="42" cy="120" r="7" fill="#38bdf8"/><circle cx="298" cy="70" r="7" fill="#ec4899"/>
          <g class="flying-plane"><text x="0" y="0" text-anchor="middle" font-size="25">✈</text></g>
          <text x="42" y="151" text-anchor="middle" fill="#9edfff" font-size="13">Nicaragua</text>
          <text x="298" y="102" text-anchor="middle" fill="#f6a5cc" font-size="13">Chile</text>
        </svg>
        <p class="loader-message">De Nicaragua a Chile, siempre conectados</p>
        <div class="loader-progress"><span></span></div>
      </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Horario de Snayder</h1>
            <p>Sincronizado en tiempo real</p>
        </div>

        <div class="card">
            <div class="selector-group">
                <label for="shift-select">Selecciona el Turno</label>
                <div class="shift-picker" id="shift-picker">
                    <button type="button" class="shift-trigger" id="shift-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="shift-menu">
                        <span id="shift-current">Turno B (Tarde)</span><span class="shift-chevron" aria-hidden="true">⌄</span>
                    </button>
                    <div class="shift-menu" id="shift-menu" role="listbox" aria-label="Selecciona el turno">
                        <button type="button" class="shift-option" role="option" data-shift="A" aria-selected="false"><span><strong>Turno A</strong><small>Mañana · 7:00 AM – 3:00 PM</small></span><span class="option-check">✓</span></button>
                        <button type="button" class="shift-option selected" role="option" data-shift="B" aria-selected="true"><span><strong>Turno B</strong><small>Tarde · 3:00 PM – 11:00 PM</small></span><span class="option-check">✓</span></button>
                        <button type="button" class="shift-option" role="option" data-shift="C" aria-selected="false"><span><strong>Turno C</strong><small>Noche · 11:00 PM – 7:00 AM</small></span><span class="option-check">✓</span></button>
                    </div>
                    <input type="hidden" id="shift-select" value="B">
                </div>
            </div>
        </div>

        <div class="switch-container">
            <span class="zone-label zone-nica" id="label-nica">Hora Nicaragua</span>
            <label class="switch">
                <input type="checkbox" id="timezone-toggle" onchange="updateUI()">
                <span class="slider round"></span>
            </label>
            <span class="zone-label zone-chile inactive-zone" id="label-chile">Hora Chile</span>
        </div>

        <div class="card live-status">
            <div class="status-badge" id="status-badge">Calculando...</div>
            <div class="status-text" id="status-text">Cargando estado...</div>
            
            <div class="main-clock" id="main-clock">--:--</div>
            <div class="clock-label-big" id="main-clock-label">ZONA HORARIA</div>
            <div class="dual-clocks" aria-label="Relojes de Nicaragua y Chile">
                <div class="mini-clock nica-mini"><span>🇳🇮 Nicaragua</span><strong id="clock-nica">--:--</strong></div>
                <div class="mini-clock chile-mini"><span>🇨🇱 Chile</span><strong id="clock-chile">--:--</strong></div>
            </div>
            <div class="time-difference" id="time-difference">Calculando diferencia horaria…</div>
        </div>

        <div class="card">
            <label style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.8rem; display: block;">Línea de Tiempo del Día</label>
            <div class="timetable" id="timetable">
                <!-- Se llena con JS -->
            </div>
        </div>

        <div class="footer">
            <div class="brand-logo">SNDR LABS</div>
        </div>
    </div>

    <script>
        // Definición de horarios en orden cronológico lógico para cada turno
        // wraps: true significa que el bloque de tiempo cruza la medianoche
        const schedules = {
            'A': {
                routine_normal: [
                    { start: 600, end: 700, state: 'En recorrido', color: 'var(--bus)', msg: 'Esperando el recorrido (6:00 AM) hacia el trabajo 🚌' },
                    { start: 700, end: 1500, state: 'En el trabajo', color: 'var(--work)', msg: 'Trabajando en el Turno A 👨‍💻' },
                    { start: 1500, end: 1600, state: 'En recorrido', color: 'var(--bus)', msg: 'Ya salió, de regreso a casa 🚌' },
                    { start: 1600, end: 600, state: 'En casa', color: 'var(--home)', msg: 'Llegó a casa. Tiempo libre y de descanso ❤️', wraps: true }
                ],
                routine_sunday: [
                    { start: 600, end: 700, state: 'En recorrido', color: 'var(--bus)', msg: 'Yendo a su turno de 12 horas 🚌' },
                    { start: 700, end: 1900, state: 'En el trabajo', color: 'var(--work)', msg: 'En su turno largo de 12 horas 👨‍💻' },
                    { start: 1900, end: 2000, state: 'En recorrido', color: 'var(--bus)', msg: 'Regresando exhausto a casa 🚌' },
                    { start: 2000, end: 600, state: 'En casa', color: 'var(--home)', msg: 'Por fin en casa descansando ❤️', wraps: true }
                ]
            },
            'B': {
                routine_normal: [
                    { start: 1400, end: 1500, state: 'En recorrido', color: 'var(--bus)', msg: 'Esperando el recorrido (2:00 PM) hacia el trabajo 🚌' },
                    { start: 1500, end: 2300, state: 'En el trabajo', color: 'var(--work)', msg: 'Trabajando en el Turno B 👨‍💻' },
                    { start: 2300, end: 130, state: 'En recorrido', color: 'var(--bus)', msg: 'De regreso. Va a llegar tarde, a eso de la 1:30 AM a casa 🌙🚌', wraps: true },
                    { start: 130, end: 1400, state: 'En casa', color: 'var(--home)', msg: 'Durmiendo y descansando en casa 😴' }
                ]
            },
            'C': {
                routine_normal: [
                    { start: 2130, end: 2300, state: 'En recorrido', color: 'var(--bus)', msg: 'Esperando el recorrido (9:30 PM) hacia el trabajo 🚌' },
                    { start: 2300, end: 700, state: 'En el trabajo', color: 'var(--work)', msg: 'En el trabajo. Turno de madrugada 👨‍💻🌙', wraps: true },
                    { start: 700, end: 800, state: 'En recorrido', color: 'var(--bus)', msg: 'Salió de turno, yendo a casa (Llega a las 8:00 AM) 🚌' },
                    { start: 800, end: 2130, state: 'En casa', color: 'var(--home)', msg: 'Durmiendo de día en casa 😴' }
                ]
            }
        };

        // Las zonas IANA aplican automáticamente el horario de verano de Chile.
        const nicaParts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Managua',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
        const nicaClock = new Intl.DateTimeFormat('en-US', {timeZone:'America/Managua',hour:'numeric',minute:'2-digit',hour12:true});
        const chileClock = new Intl.DateTimeFormat('en-US', {timeZone:'America/Santiago',hour:'numeric',minute:'2-digit',hour12:true});
        const chileOffsetParts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Santiago',timeZoneName:'longOffset',hour:'2-digit'});
        function getChileOffset(date) {
            const name = chileOffsetParts.formatToParts(date).find(p => p.type === 'timeZoneName').value;
            const match = name.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
            return match ? (match[1] === '-' ? -1 : 1) * (Number(match[2])*60 + Number(match[3]||0)) : 0;
        }
        function format12h(val, useChile, baseDate) {
            const h = Math.floor(val / 100), m = val % 100;
            if (useChile) {
                // Convertir la hora de Nicaragua del día correspondiente a un instante real.
                const d = baseDate || new Date();
                const parts = Object.fromEntries(nicaParts.formatToParts(d).map(p=>[p.type,p.value]));
                const instant = new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day),h+6,m));
                return chileClock.format(instant).replace(/\s/g,' ');
            }
            return `${h%12 || 12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
        }

        function isCurrentBlockActive(timeVal, block) {
            if (block.wraps) {
                return (timeVal >= block.start || timeVal < block.end);
            }
            return (timeVal >= block.start && timeVal < block.end);
        }

        function updateUI() {
            try {
                const shiftId = document.getElementById('shift-select').value;
                const useChileTime = document.getElementById('timezone-toggle').checked;
                const shift = schedules[shiftId];
                
                // Actualizar labels del toggle
                const lblNica = document.getElementById('label-nica');
                const lblChile = document.getElementById('label-chile');
                const mainClock = document.getElementById('main-clock');
                const mainClockLabel = document.getElementById('main-clock-label');
                
                if (useChileTime) {
                    lblNica.classList.add('inactive-zone');
                    lblChile.classList.remove('inactive-zone');
                    mainClock.style.color = 'var(--chile-color)';
                    mainClockLabel.innerText = 'HORA EN CHILE';
                } else {
                    lblNica.classList.remove('inactive-zone');
                    lblChile.classList.add('inactive-zone');
                    mainClock.style.color = 'var(--accent)';
                    mainClockLabel.innerText = 'HORA EN NICARAGUA';
                }

                // Hora de Nicaragua, independiente de la zona del dispositivo.
                const now = new Date();
                document.getElementById('clock-nica').textContent = nicaClock.format(now);
                document.getElementById('clock-chile').textContent = chileClock.format(now);
                const diff = (getChileOffset(now) + 360) / 60;
                document.getElementById('time-difference').textContent = diff === 0 ? 'Ambos países tienen la misma hora' : `Chile está ${Math.abs(diff)} ${Math.abs(diff) === 1 ? 'hora' : 'horas'} ${diff > 0 ? 'adelante' : 'atrás'} de Nicaragua`;
                const parts = Object.fromEntries(nicaParts.formatToParts(now).map(p=>[p.type,p.value]));
                const hours = Number(parts.hour), minutes = Number(parts.minute);
                const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday);
                const currentTimeVal = hours * 100 + minutes;
                mainClock.innerText = useChileTime ? chileClock.format(now) : format12h(currentTimeVal, false);

                // Determinar rutina activa
                let routine = shift.routine_normal;
                let isFreeDay = false;
                let currentStatus = { state: 'Libre', color: 'var(--free)', msg: '¡Hoy está libre! En casa descansando.' };

                if (shiftId === 'A') {
                    if (day === 5) { isFreeDay = true; } 
                    else if (day === 0) { routine = shift.routine_sunday; }
                } else if (shiftId === 'B' || shiftId === 'C') {
                    if (day === 0) { isFreeDay = true; }
                }

                // Encontrar bloque actual si no es día libre
                if (!isFreeDay) {
                    for (let block of routine) {
                        if (isCurrentBlockActive(currentTimeVal, block)) {
                            currentStatus = block;
                            break;
                        }
                    }
                }

                // Actualizar UI del estado actual
                const badge = document.getElementById('status-badge');
                badge.innerText = currentStatus.state;
                badge.style.color = currentStatus.color;
                badge.style.border = `1px solid ${currentStatus.color}`;
                document.getElementById('status-text').innerText = currentStatus.msg;

                // Renderizar Línea de Tiempo
                const timetableBox = document.getElementById('timetable');
                timetableBox.innerHTML = '';
                
                const timelineColor = useChileTime ? 'var(--chile-color)' : 'var(--accent)';
                
                if (isFreeDay) {
                    timetableBox.innerHTML = `<div style="text-align:center; padding: 1rem; color: var(--free); font-weight: 600;">✨ Hoy es su día libre ✨</div>`;
                } else {
                    routine.forEach(block => {
                        let isActive = isCurrentBlockActive(currentTimeVal, block);
                        let timeStr = `${format12h(block.start, useChileTime, now)} - ${format12h(block.end, useChileTime, now)}`;
                        
                        let html = `
                            <div class="timeline-item" style="opacity: ${isActive ? '1' : '0.4'};">
                                <div class="time-col" style="color: ${timelineColor};">
                                    ${timeStr}
                                </div>
                                <div class="desc-col" style="border-left-color: ${block.color}">
                                    <div class="desc-title" style="color: ${block.color}">${block.state}</div>
                                    <div class="desc-sub">${block.msg}</div>
                                </div>
                            </div>
                        `;
                        timetableBox.innerHTML += html;
                    });
                }
            } catch (error) {
                console.error("Error updating UI:", error);
                document.getElementById('status-text').innerText = "Error cargando la hora. Refresca la página.";
            }
        }

        // Inicializar cuando el DOM esté listo (Solución para iOS)
        document.addEventListener("DOMContentLoaded", () => {
            const picker = document.getElementById('shift-picker');
            const trigger = document.getElementById('shift-trigger');
            const options = [...document.querySelectorAll('.shift-option')];
            const names = {A:'Turno A (Mañana)',B:'Turno B (Tarde)',C:'Turno C (Noche)'};
            const savedShift = (() => {try{return localStorage.getItem('sndr-selected-shift')}catch(e){return null}})();
            if (savedShift && names[savedShift]) {
                document.getElementById('shift-select').value = savedShift;
                document.getElementById('shift-current').textContent = names[savedShift];
                options.forEach(o => {const active=o.dataset.shift===savedShift;o.classList.toggle('selected',active);o.setAttribute('aria-selected',String(active));});
            }
            const closePicker = () => {picker.classList.remove('open');trigger.setAttribute('aria-expanded','false');};
            trigger.addEventListener('click', () => {
                const opened = picker.classList.toggle('open');
                trigger.setAttribute('aria-expanded',String(opened));
            });
            options.forEach(option => option.addEventListener('click', () => {
                const value = option.dataset.shift;
                document.getElementById('shift-select').value = value;
                try {localStorage.setItem('sndr-selected-shift',value)} catch(e) {}
                document.getElementById('shift-current').textContent = names[value];
                options.forEach(o=>{const active=o===option;o.classList.toggle('selected',active);o.setAttribute('aria-selected',String(active));});
                closePicker();updateUI();trigger.focus();
            }));
            document.addEventListener('click', e => {if(!picker.contains(e.target))closePicker();});
            document.addEventListener('keydown', e => {if(e.key==='Escape')closePicker();});
            updateUI();
            setInterval(updateUI, 15000);
            const loader = document.getElementById('connect-loader');
            window.setTimeout(() => loader.classList.add('hidden'), 1950);
        });
    </script>
</body>
</html>
